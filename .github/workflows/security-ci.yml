name: SentinelGRC DevSecOps CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    security-tests:
        name: Security Rule Unit Tests & SAST
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/node-mono@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Setup Java (Required for Firebase Emulators)
              uses: actions/setup-java@v3
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Run Dependency Vulnerability Audit (SAST - SEC-403)
              run: npm audit --audit-level=high

            - name: Run Firestore Security Rules Test Suite (SEC-402 / SEC-401)
              run: npx firebase emulators:exec --only firestore "npm test"
